<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEAR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020204;color:#eee;font-family:Georgia,"Times New Roman",serif}button,input{font:inherit}button{cursor:pointer}
#root{height:100%}.screen{height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#24151a 0,#09070a 38%,#020204 80%);overflow:hidden}
.fog{position:absolute;inset:-30%;background:radial-gradient(ellipse,#e5d8d522,transparent 48%);filter:blur(32px);animation:fog 14s infinite alternate ease-in-out}@keyframes fog{to{transform:translate(8%,-5%) scale(1.2)}}.grain{position:absolute;inset:0;opacity:.12;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px;animation:grain .1s steps(2) infinite}@keyframes grain{50%{transform:translate(2px,1px)}}
.logo{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-size:clamp(70px,13vw,150px);letter-spacing:.22em;margin-left:.22em;line-height:.8;color:#ddd;text-shadow:0 0 7px #fff,0 0 28px #b22f3c,5px 6px 0 #240d12;animation:logo 3.5s infinite}.logo:after{content:"";display:block;height:3px;width:80%;margin:18px auto;background:#9d303c;box-shadow:0 0 18px #9d303c;animation:slash 2s infinite}@keyframes logo{0%,8%,10%,50%,52%,100%{opacity:1;transform:skew(0)}9%,51%{opacity:.45;transform:skew(-2deg)}}@keyframes slash{50%{width:45%}}
.menu{position:relative;z-index:2;text-align:center;width:min(620px,92vw)}.tag{font:12px Arial;letter-spacing:.65em;color:#a99ca1;margin:0 0 35px}.buttons{display:flex;flex-direction:column;gap:10px;width:300px;margin:auto}.buttons button{background:#09090dd9;border:1px solid #58464d;color:#eee;padding:13px 25px;text-transform:uppercase;letter-spacing:3px}.buttons button:hover{background:#32161d;border-color:#b04a57;box-shadow:0 0 25px #a6324033}.special{margin-top:26px;background:none;border:0;color:#c2b5b9;font:11px Arial;letter-spacing:2px;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}#menuEzra{position:absolute;right:3%;bottom:-4%;height:70vh;max-width:42vw;object-fit:contain;opacity:.28;filter:brightness(.5) contrast(1.2);animation:breath 5s infinite ease-in-out}@keyframes breath{50%{transform:scale(1.035) translateY(-8px);opacity:.4}}
.modal{position:absolute;inset:0;z-index:10;background:#000c;display:flex;align-items:center;justify-content:center}.box{width:min(700px,92vw);background:#0c0b10;border:1px solid #554149;border-radius:15px;padding:25px;box-shadow:0 0 70px #000}.box h2{margin-top:0;letter-spacing:4px}.quality{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.quality button.active{background:#52202a;border-color:#d05b68}.controls{line-height:2;color:#c8bdc1;font-family:Arial}.close{margin-top:18px}
.charGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.char{background:#0a0a0f;border:1px solid #3a3035;border-radius:10px;text-align:center;padding:5px}.char.sel{border-color:#d75b68;box-shadow:0 0 20px #b7445055}.char img{width:100%;height:180px;object-fit:contain}.room{width:min(1000px,94vw);padding:22px;background:#09090de8;border:1px solid #49383e;border-radius:15px;z-index:2}.roomgrid{display:grid;grid-template-columns:1fr 340px;gap:12px}.lobbyview{height:430px;background:#15131a;border:1px solid #342b31;position:relative;overflow:hidden}.wall{position:absolute;inset:8%;border:10px solid #30282e;background:#111016}.door{position:absolute;right:5%;top:35%;width:35px;height:120px;background:#35262a;border:2px solid #786068}.playerSprite{position:absolute;width:72px;height:72px;object-fit:contain}.bar{position:absolute;left:10px;top:10px;display:flex;gap:6px}.bar button{background:#16131a;border:1px solid #55434b;color:#ddd;padding:7px}.chat{height:300px;background:#06060ad9;border:1px solid #393037;display:flex;flex-direction:column}.log{flex:1;overflow:auto;padding:8px;font:13px Arial}.line{margin:4px 0}.line b{color:#f08a95}.sys{color:#888}.chatbar{display:flex;border-top:1px solid #30272c}.chatbar input{flex:1;background:transparent;border:0;color:white;padding:10px}.chatbar button{border:0;background:#17131a;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#game{height:100%;position:relative;background:#020205}canvas{width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.hudTop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between}.badge{background:#07070ddd;border:1px solid #3e3439;padding:8px 11px;border-radius:8px;font:12px Arial}.death{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:8}.death .ez{height:48vh;max-width:80vw;object-fit:contain;animation:jumpscare .35s infinite alternate}@keyframes jumpscare{to{transform:scale(1.08)}}.deadtitle{font:900 42px Arial;color:#e45460;text-shadow:0 0 20px #a11;letter-spacing:6px}.respawn{font:16px Arial;margin-top:10px}.inv{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.slot{width:55px;height:55px;border:1px solid #62565a;background:#111017cc;display:flex;align-items:center;justify-content:center;font:11px Arial;text-align:center}.inventory{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);display:none;grid-template-columns:repeat(7,55px);gap:5px;pointer-events:auto}.gameChat{position:absolute;left:10px;bottom:82px;width:330px;background:#07070ddd;border:1px solid #40353a;pointer-events:auto}.gameChat .log{height:130px}.toggle{position:absolute;left:10px;bottom:45px;pointer-events:auto}.ending{position:absolute;inset:0;background:#000;display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column;text-align:center}.ending img{height:75vh;max-width:90vw;object-fit:contain;animation:approach 7s forwards}@keyframes approach{from{transform:scale(.25);opacity:0}to{transform:scale(1.1);opacity:1}}.subtitle{position:absolute;bottom:8%;font:22px Arial;color:white;text-shadow:0 2px 8px #000;opacity:0;animation:sub 1s 5s forwards}@keyframes sub{to{opacity:1}}.win{font:26px Arial;color:#ddd;margin-top:10px;opacity:0;animation:sub 1s 8s forwards}
.loading{position:absolute;inset:0;background:#030306;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column}.loading .lLogo{font:900 clamp(42px,8vw,90px) Arial;letter-spacing:.25em;text-shadow:0 0 20px #a6333e;animation:logo 1.8s infinite}.loading img{position:absolute;inset:18% 20%;width:60%;height:60%;object-fit:contain;opacity:.2}.loadText{margin-top:35px;font:14px Arial;letter-spacing:7px}.dots{animation:dots 1s infinite}@keyframes dots{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
@media(max-width:750px){.roomgrid{grid-template-columns:1fr}.lobbyview{height:300px}.char img{height:135px}.charGrid{grid-template-columns:repeat(2,1fr)}.quality{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div id="root"></div>
<script>
const A="/assets/",chars=["character1.png","character2.png","character3.png","character4.png"],root=document.getElementById("root");
let playerName="Player",character=0,quality="Ultra",roomCode="",playerId="",room=null,host=false,mode="",keys={},mapIndex=0,game=null,poll=null;
const maps=[{name:"THE RED CORRIDOR",w:31,h:23,start:[2,2],exit:[28,20],walls:[[0,0,31,1],[0,22,31,1],[0,0,1,23],[30,0,1,23],[4,1,1,8],[4,12,1,9],[9,0,1,6],[9,9,1,8],[9,18,1,4],[14,1,1,8],[14,12,1,10],[19,0,1,7],[19,10,1,8],[19,19,1,3],[24,1,1,8],[24,12,1,9],[28,0,1,5],[28,8,1,7],[28,16,1,6],[1,6,4,1],[6,6,4,1],[11,6,3,1],[16,6,3,1],[21,6,3,1],[26,6,4,1],[1,16,4,1],[6,16,4,1],[11,16,4,1],[16,16,4,1],[21,16,4,1],[26,16,4,1]]},{name:"DROWNED WING",w:31,h:23,start:[2,20],exit:[28,2],walls:[[0,0,31,1],[0,22,31,1],[0,0,1,23],[30,0,1,23],[5,3,1,17],[10,0,1,7],[10,10,1,13],[15,3,1,17],[20,0,1,8],[20,11,1,12],[25,3,1,17],[1,5,4,1],[6,5,4,1],[11,5,4,1],[16,5,4,1],[21,5,4,1],[26,5,4,1],[1,17,4,1],[6,17,4,1],[11,17,4,1],[16,17,4,1],[21,17,4,1],[26,17,4,1]]},{name:"THE FALSE HOUSE",w:31,h:23,start:[15,2],exit:[15,20],walls:[[0,0,31,1],[0,22,31,1],[0,0,1,23],[30,0,1,23],[3,3,1,16],[7,3,1,5],[7,12,1,7],[11,0,1,8],[11,11,1,12],[15,5,1,13],[19,0,1,8],[19,11,1,12],[23,3,1,16],[27,3,1,5],[27,12,1,7],[1,7,6,1],[8,7,3,1],[12,7,3,1],[16,7,3,1],[20,7,3,1],[24,7,6,1],[1,15,6,1],[8,15,3,1],[12,15,3,1],[16,15,3,1],[20,15,3,1],[24,15,6,1]]}];

function main(){root.innerHTML=`<div class="screen"><div class="fog"></div><div class="grain"></div><img id="menuEzra" src="${A}ezra.png"><div class="menu"><div class="logo">HEAR</div><div class="tag">DO NOT LET IT HEAR YOU</div><div class="buttons"><button onclick="playMenu()">PLAY</button><button onclick="settings()">SETTINGS</button><button onclick="credits()">CREDITS</button></div><button class="special" onclick="specialThanks()">CLICK HERE FOR SPECIAL THANKS</button></div></div>`}
function playMenu(){playerName=prompt("PLAYER NAME",playerName)||"Player";root.innerHTML=`<div class="screen"><div class="fog"></div><div class="menu"><div class="logo" style="font-size:70px">HEAR</div><div class="buttons"><button onclick="characterSelect('single')">SINGLEPLAYER</button><button onclick="characterSelect('multi')">MULTIPLAYER</button><button onclick="main()">BACK</button></div></div></div>`}
function characterSelect(kind){root.innerHTML=`<div class="screen"><div class="menu" style="width:min(900px,94vw)"><h2 style="letter-spacing:5px">CHARACTER SELECT</h2><p class="tag">YOU CANNOT CHANGE YOUR STYLE AFTER THE GAME STARTS.</p><div class="charGrid">${chars.map((c,i)=>`<div class="char ${i===character?"sel":""}" onclick="character=${i};characterSelect('${kind}')"><img src="${A+c}"><small>STYLE ${String.fromCharCode(65+i)}</small></div>`).join("")}</div><div class="row" style="justify-content:center;margin-top:14px"><button onclick="${kind==="single"?"singleLobby()":"multiLobby()"}">CONTINUE</button><button onclick="playMenu()">BACK</button></div></div></div>`}
function settings(){root.innerHTML=`<div class="screen"><div class="box"><h2>SETTINGS</h2><h3>QUALITY</h3><div class="quality">${["Ultra","High","Medium","Low","Potato"].map(q=>`<button class="${quality===q?"active":""}" onclick="quality='${q}';settings()">${q}</button>`).join("")}</div><p class="controls"><b>CONTROLS</b><br>I → INVENTORY<br>W/A/S/D → WALK<br>E → INTERACTIVE</p><p class="muted">Quality presets are visual placeholders and do not change gameplay graphics in this prototype.</p><button class="close" onclick="main()">BACK</button></div></div>`}
function credits(){root.innerHTML=`<div class="screen"><div class="box"><h2>CREDITS</h2><p>Developer; Azra CAKMAKCI aka riuva</p><p style="margin-top:30px">I would also like to send all my thanks to Miyu aka Hayal and Alley Allen aka Ali.</p><button class="close" onclick="main()">BACK</button></div></div>`}
let specialAudio=null;function specialThanks(){if(!specialAudio)specialAudio=new Audio(A+"special_thanks.mpeg");specialAudio.currentTime=0;specialAudio.play().catch(()=>{});}
function singleLobby(){mode="singleLobby";lobbyUI(true);setLobbyMotion()}
async function multiLobby(){mode="multiLobby";lobbyUI(false);setLobbyMotion()}
function lobbyUI(single){root.innerHTML=`<div class="screen"><div class="room"><h1 style="letter-spacing:5px">LOBBY ${single?"":"· MULTIPLAYER"}</h1><div class="roomgrid"><div><div class="lobbyview" id="lview"><div class="wall"></div><div class="door" id="door"></div><img id="lp" class="playerSprite" src="${A+chars[character]}"></div><div class="bar">${chars.map((c,i)=>`<button onclick="character=${i};document.getElementById('lp').src=A+chars[i]">STYLE ${String.fromCharCode(65+i)}</button>`).join("")}</div><p class="muted">W/A/S/D to walk · E to interact with the door</p></div><div><div class="chat"><div class="log" id="lchat"></div><div class="chatbar"><input id="li" placeholder="TYPE A MESSAGE"><button onclick="lmsg()">↵</button></div></div>${single?'<button style="width:100%;margin-top:10px" onclick="openSingleDoor()">E — OPEN DOOR</button>':'<div class="row"><button onclick="joinPrompt()">JOIN FRIEND\'S ROOM</button><button onclick="createRoom()">CREATE ROOM</button></div><div id="roomInfo" class="card" style="margin-top:10px">Create a room or join a friend with a code.</div>'}<button style="width:100%;margin-top:10px" onclick="main()">BACK</button></div></div></div></div>`}
function setLobbyMotion(){addEventListener("keydown",kd);addEventListener("keyup",ku);requestAnimationFrame(lobbyLoop)}
function lobbyLoop(){if(!["singleLobby","multiLobby"].includes(mode))return;let p=document.getElementById("lp");if(p){let l=+(p.dataset.x||300),t=+(p.dataset.y||180),s=.7;if(keys.w)t-=s;if(keys.s)t+=s;if(keys.a)l-=s;if(keys.d)l+=s;l=Math.max(70,Math.min(innerWidth*.45,l));t=Math.max(70,Math.min(380,t));p.dataset.x=l;p.dataset.y=t;p.style.left=l+"px";p.style.top=t+"px"}requestAnimationFrame(lobbyLoop)}
function kd(e){keys[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==="e"&&mode==="singleLobby")openSingleDoor()}function ku(e){keys[e.key.toLowerCase()]=0}
function openSingleDoor(){loading(()=>startGame(false))}
function loading(done){let m=maps[Math.floor(Math.random()*maps.length)];mapIndex=maps.indexOf(m);root.innerHTML=`<div class="loading"><img src="${A}ezra.png"><div class="lLogo">HEAR</div><div class="loadText">LOADING<span class="dots">...</span></div><div style="margin-top:15px;color:#9c9196;font:12px Arial;letter-spacing:2px">${m.name}</div></div>`;setTimeout(done,5000)}
async function createRoom(){try{let j=await req("/api/create",{name:playerName,character});room=j.room;roomCode=room.code;playerId=j.playerId;host=true;document.getElementById("roomInfo").innerHTML="<b>ROOM CODE: "+roomCode+"</b><br>Share this code with your friend.";startPoll()}catch(e){alert(e.message)}}
async function joinPrompt(){let c=prompt("ENTER ROOM CODE");if(!c)return;try{let j=await req("/api/join",{name:playerName,character,code:c});room=j.room;roomCode=room.code;playerId=j.playerId;host=false;document.getElementById("roomInfo").innerHTML="<b>ROOM CODE: "+roomCode+"</b>";startPoll()}catch(e){alert(e.message)}}
function startPoll(){clearInterval(poll);poll=setInterval(async()=>{try{let j=await req("/api/state",{code:roomCode,playerId});room=j.room;renderLobbyNet();if(room.started&&mode==="multiLobby")loading(()=>startGame(true))}catch(e){}},400)}
function renderLobbyNet(){let el=document.getElementById("lchat"),inf=document.getElementById("roomInfo");if(!el)return;el.innerHTML=room.chat.map(line).join("");el.scrollTop=99999;if(inf)inf.innerHTML=`<b>ROOM CODE: ${roomCode}</b><br>${room.players.length} player(s) in lobby ${room.players.length>=2?"<br><button onclick='startMulti()'>START GAME</button>":"<br>Waiting for another player..."}`;if(room.players)room.players.forEach((p,i)=>{if(p.id!==playerId){let im=document.getElementById("other"+p.id);if(!im){im=document.createElement("img");im.id="other"+p.id;im.className="playerSprite";im.src=A+chars[p.character];document.getElementById("lview").appendChild(im)}im.style.left=(100+i*90)+"px";im.style.top="180px"}})}
async function startMulti(){await req("/api/state",{code:roomCode,playerId,start:true})}
async function lmsg(){let x=document.getElementById("li");if(x.value&&room)await req("/api/state",{code:roomCode,playerId,chat:x.value});x.value=""}
async function req(p,b){let r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error);return j}
function line(m){return `<div class="line ${m.system?"sys":""}"><b>${esc(m.from)}</b>: ${esc(m.text)}</div>`}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function startGame(net){mode="game";clearInterval(poll);let m=maps[net?room.map:mapIndex];game={map:m,x:m.start[0],y:m.start[1],alive:true,escaped:false,spectate:false,items:net?room.items.map(x=>({...x})):JSON.parse(JSON.stringify([{id:0,name:"Seventh Bell",digit:7,x:6,y:3,collected:false},{id:1,name:"Third Eye",digit:3,x:13,y:19,collected:false},{id:2,name:"Fourth Key",digit:4,x:22,y:9,collected:false},{id:3,name:"Second Candle",digit:2,x:27,y:19,collected:false},{id:4,name:"Silent Ribbon",digit:null,x:8,y:11,collected:false}])),inv:[],ezra:{x:m.start[0]+9,y:m.start[1]+6},net};root.innerHTML=`<div id="game"><canvas id="cv"></canvas><div class="hud"><div class="hudTop"><div class="badge">${m.name}</div><div class="badge">EXIT: <span id="exit">????</span></div></div><div class="gameChat" id="gchat"><div class="log" id="glog"></div><div class="chatbar"><input id="gi" placeholder="TYPE A MESSAGE"><button onclick="gmsg()">↵</button></div></div><button class="toggle" onclick="toggleChat()">CHAT</button><div class="inv" id="hotbar">${[0,1,2].map(i=>`<div class="slot" id="slot${i}"></div>`).join("")}</div><div class="inventory" id="inventory">${Array.from({length:7},(_,i)=>`<div class="slot" id="is${i}"></div>`).join("")}</div><div class="death" id="death"><img class="ez" src="${A}ezra.png"><div class="deadtitle">CAUGHT</div><div class="respawn" id="respawn">RESPAWN (5)</div></div><div class="ending" id="ending"><img src="${A}ezra.png"><div class="subtitle">You escaped... but Ezra is not finished.</div><div class="win">You did it. Congratulations.</div></div></div></div>`;setTimeout(()=>{addChat("???","Can you hear me?");let a=new Audio(A+"game_whisper.mp3");a.play().catch(()=>{})},3000);addEventListener("keydown",gameKey);addEventListener("keyup",ku);requestAnimationFrame(gameLoop)}
function gameKey(e){let k=e.key.toLowerCase();keys[k]=1;if(k==="i"){let x=document.getElementById("inventory");x.style.display=x.style.display==="grid"?"none":"grid"}if(k==="e")gameInteract()}
function gameLoop(){if(mode!=="game")return;let g=game;if(g.alive&&!g.escaped&&!g.spectate){let s=.024;if(keys.w)move(0,-s);if(keys.s)move(0,s);if(keys.a)move(-s,0);if(keys.d)move(s,0);pickup();checkExit();}if(g.net&&room){syncGame()}else monster();drawGame();requestAnimationFrame(gameLoop)}
function blocked(x,y){let m=game.map;return x<1||y<1||x>=m.w-1||y>=m.h-1||m.walls.some(a=>x>=a[0]&&x<a[0]+a[2]&&y>=a[1]&&y<a[1]+a[3])}
function move(dx,dy){if(!blocked(game.x+dx,game.y))game.x+=dx;if(!blocked(game.x,game.y+dy))game.y+=dy}
function pickup(){let q=game.items.find(q=>!q.collected&&Math.hypot(q.x-game.x,q.y-game.y)<.75);if(q){q.collected=true;if(game.inv.length<7)game.inv.push(q.name);renderInv();if(game.net)req("/api/state",{code:roomCode,playerId,pickup:q.id})}}
function renderInv(){game.inv.forEach((v,i)=>{let a=document.getElementById("is"+i);if(a)a.textContent=v;let h=document.getElementById("slot"+(i%3));if(h)h.textContent=v})}
function gameInteract(){let q=game.items.find(q=>!q.collected&&Math.hypot(q.x-game.x,q.y-game.y)<1);if(q){alert(q.name+"\\n"+(q.digit?"A clue is hidden in this name.":"Something about this item feels unfinished."));return}if(Math.hypot(game.map.exit[0]-game.x,game.map.exit[1]-game.y)<1.5){if(game.items.filter(x=>x.collected).length>=5){let code="7342";let got=prompt("ENTER THE 4-DIGIT CODE");if(got===code)escapeGame();else alert("The lock rejects the code.")}else alert("The lock needs five items.")}}
function checkExit(){if(Math.hypot(game.map.exit[0]-game.x,game.map.exit[1]-game.y)<1.5&&game.items.filter(x=>x.collected).length>=5)document.getElementById("exit").textContent="7342"}
function monster(){let m=game.map,e=game.ezra,dx=game.x-e.x,dy=game.y-e.y,d=Math.hypot(dx,dy)||1;if(d<13){let s=.031,l=d;if(!blocked(e.x+dx/l*s,e.y))e.x+=dx/l*s;if(!blocked(e.x,e.y+dy/l*s))e.y+=dy/l*s}if(d<.62)die()}
let lastSync=0;async function syncGame(){if(Date.now()-lastSync<180)return;lastSync=Date.now();try{let j=await req("/api/state",{code:roomCode,playerId,x:game.x,y:game.y});room=j.room;game.items=room.items.map(x=>({...x}));game.ezra=j.monster;let me=room.players.find(p=>p.id===playerId);if(me&&!me.alive&&game.alive)die(true);if(me?.escaped&&!game.escaped)escapeGame(true);document.getElementById("glog").innerHTML=room.chat.map(line).join("");document.getElementById("glog").scrollTop=99999;if(room.ending)endScreen()}catch(e){}}
function die(serverDeath=false){if(!game.alive)return;game.alive=false;document.getElementById("death").style.display="flex";let n=5,el=document.getElementById("respawn"),timer=setInterval(()=>{n--;el.textContent=n>0?"RESPAWN ("+n+")":"RESPAWN";if(n<=0){clearInterval(timer);el.textContent="RESPAWN";el.style.cursor="pointer";el.onclick=respawn}},1000);if(game.net&&!serverDeath)req("/api/state",{code:roomCode,playerId,x:game.x,y:game.y})}
function respawn(){if(game.net)req("/api/state",{code:roomCode,playerId,respawn:true});game.alive=true;game.x=game.map.start[0];game.y=game.map.start[1];document.getElementById("death").style.display="none"}
function escapeGame(){game.escaped=true;game.spectate=true;if(game.net)req("/api/state",{code:roomCode,playerId,escaped:true});addChat("SYSTEM","You escaped. Spectate mode enabled.",true);setTimeout(()=>{},100)}
function endScreen(){document.getElementById("ending").style.display="flex"}
function addChat(from,text,sys=false){let x=document.getElementById("glog");if(x){x.innerHTML+=line({from,text,system:sys});x.scrollTop=99999}}
function toggleChat(){let x=document.getElementById("gchat");x.style.display=x.style.display==="none"?"block":"none"}
async function gmsg(){let x=document.getElementById("gi");if(!x.value)return;if(game.net)await req("/api/state",{code:roomCode,playerId,chat:x.value});else addChat(playerName,x.value);x.value=""}
function drawGame(){let c=document.getElementById("cv"),ctx=c.getContext("2d"),m=game.map;c.width=innerWidth;c.height=innerHeight;let t=Math.min(c.width/m.w,c.height/m.h),ox=(c.width-m.w*t)/2,oy=(c.height-m.h*t)/2;ctx.fillStyle="#020205";ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++){ctx.fillStyle=blocked(x,y)?"#171219":"#07090d";ctx.fillRect(ox+x*t,oy+y*t,t-1,t-1)}game.items.forEach((q,i)=>{if(q.collected)return;ctx.beginPath();ctx.arc(ox+(q.x+.5)*t,oy+(q.y+.5)*t,5+Math.sin(Date.now()/140+i)*2,0,7);ctx.fillStyle="#ffd36d";ctx.shadowBlur=22;ctx.shadowColor="#ff9f30";ctx.fill();ctx.shadowBlur=0});ctx.strokeStyle="#63383f";ctx.lineWidth=4;ctx.strokeRect(ox+m.exit[0]*t+3,oy+m.exit[1]*t+3,t-6,t-6);drawImg(ctx,A+"ezra.png",game.ezra.x,game.ezra.y,t*1.5,ox,oy,t);drawImg(ctx,A+chars[character],game.x,game.y,t*1.2,ox,oy,t);let g=ctx.createRadialGradient(c.width/2,c.height/2,40,c.width/2,c.height/2,Math.max(c.width,c.height)*.7);g.addColorStop(0,"transparent");g.addColorStop(1,"#000e");ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height)}
function drawImg(ctx,src,x,y,z,ox,oy,t){let im=new Image();im.src=src;ctx.drawImage(im,ox+(x+.5)*t-z/2,oy+(y+.5)*t-z/2,z,z)}
main();
</script></body></html>
